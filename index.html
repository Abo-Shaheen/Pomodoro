<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 30px 20px;
        }

        /* العنوان */
        #mode {
            font-size: 32px;
            margin-bottom: 25px;
        }

        /* العداد الدائري */
        .timer {
            width: 300px;
            height: 300px;
            margin: 0 auto 35px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            position: absolute;
            width: 300px;
            height: 300px;
            transform: rotate(-90deg);
        }

        .background-circle {
            fill: none;
            stroke: #292929;
            stroke-width: 12;
        }

        .progress-circle {
            fill: none;
            stroke: white;
            stroke-width: 12;
            stroke-linecap: round;

            /*
                المحيط = 2 × π × 120 ≈ 754
            */
            stroke-dasharray: 754;
            stroke-dashoffset: 0;

            transition: stroke 0.3s;
        }

        #time {
            position: relative;
            z-index: 2;
            font-size: 55px;
            font-weight: bold;
            direction: ltr;
        }

        /* حقول الوقت */
        .inputs {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .input-box {
            flex: 1;
        }

        .input-box label {
            display: block;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 20px;
            text-align: center;
            outline: none;
        }

        .input-box input:focus {
            border-color: white;
        }

        /* زر البدء / الإنهاء */
        #startBtn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #startBtn:hover {
            opacity: 0.9;
        }

        #startBtn.running {
            background: #e53935;
            color: white;
        }

        /* منع تعديل الأوقات أثناء التشغيل */
        input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 400px) {
            .timer,
            svg {
                width: 260px;
                height: 260px;
            }

            #time {
                font-size: 45px;
            }

            #mode {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- تركيز / راحة -->
    <h1 id="mode">تركيز</h1>

    <!-- العداد الدائري -->
    <div class="timer">

        <svg viewBox="0 0 260 260">

            <circle
                class="background-circle"
                cx="130"
                cy="130"
                r="120">
            </circle>

            <circle
                id="progress"
                class="progress-circle"
                cx="130"
                cy="130"
                r="120">
            </circle>

        </svg>

        <div id="time">25:00</div>

    </div>

    <!-- أوقات التركيز والراحة -->
    <div class="inputs">

        <div class="input-box">
            <label for="focusTime">وقت التركيز</label>
            <input
                id="focusTime"
                type="number"
                min="1"
                value="25">
        </div>

        <div class="input-box">
            <label for="breakTime">وقت الراحة</label>
            <input
                id="breakTime"
                type="number"
                min="1"
                value="5">
        </div>

    </div>

    <!-- زر البدء / الإنهاء -->
    <button id="startBtn">بدء</button>

</div>


<script>

    // ==========================================
    // إعدادات الصوت
    // ضع ملفات الصوت الخاصة بك هنا
    // ==========================================

    const focusSound = new Audio("Windows Notify Email.wav");
    const breakSound = new Audio("Windows Notify Calendar.wav");

    /*
        مثال لوضع الملفات:

        const focusSound = new Audio("sounds/focus.mp3");
        const breakSound = new Audio("sounds/break.mp3");
    */


    // ==========================================
    // عناصر الصفحة
    // ==========================================

    const modeText = document.getElementById("mode");
    const timeText = document.getElementById("time");

    const progressCircle = document.getElementById("progress");

    const focusInput = document.getElementById("focusTime");
    const breakInput = document.getElementById("breakTime");

    const startBtn = document.getElementById("startBtn");


    // ==========================================
    // إعدادات العداد
    // ==========================================

    const circumference = 2 * Math.PI * 120;

    let timer = null;

    let isRunning = false;

    let isFocus = true;

    let remainingSeconds = 0;

    let totalSeconds = 0;


    // ==========================================
    // عرض الوقت
    // ==========================================

    function updateTimeDisplay() {

        const minutes = Math.floor(remainingSeconds / 60);

        const seconds = remainingSeconds % 60;

        timeText.textContent =
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");
    }


    // ==========================================
    // تحديث الدائرة
    // ==========================================

    function updateCircle() {

        const progress =
            remainingSeconds / totalSeconds;

        /*
            التركيز:
            الدائرة تتحرك في اتجاه معين

            الراحة:
            الدائرة تتحرك في الاتجاه العكسي
        */

        if (isFocus) {

            progressCircle.style.strokeDashoffset =
                circumference * (1 - progress);

        } else {

            progressCircle.style.strokeDashoffset =
                circumference * progress;
        }
    }


    // ==========================================
    // تغيير وضع التركيز / الراحة
    // ==========================================

    function changeMode() {

        // تشغيل صوت انتهاء المرحلة السابقة
        if (isFocus) {

            // انتهى التركيز
            playSound(focusSound);

            // الانتقال للراحة
            isFocus = false;

            totalSeconds =
                parseInt(breakInput.value) * 60;

        } else {

            // انتهت الراحة
            playSound(breakSound);

            // العودة للتركيز
            isFocus = true;

            totalSeconds =
                parseInt(focusInput.value) * 60;
        }

        remainingSeconds = totalSeconds;

        // تغيير العنوان
        modeText.textContent =
            isFocus ? "تركيز" : "راحة";

        // تغيير لون الدائرة
        progressCircle.style.stroke =
            isFocus ? "white" : "#FFD600";

        updateTimeDisplay();
        updateCircle();
    }


    // ==========================================
    // تشغيل الصوت
    // ==========================================

    function playSound(sound) {

        /*
            لو لم تضع ملف صوت، لن يحدث شيء.
            فقط ضع مسار الملف داخل Audio بالأعلى.
        */

        if (!sound.src || sound.src.endsWith("/")) {
            return;
        }

        sound.currentTime = 0;

        sound.play().catch(() => {});
    }


    // ==========================================
    // تشغيل العداد
    // ==========================================

    function startTimer() {

        if (isRunning) {
            return;
        }

        isRunning = true;

        startBtn.textContent = "إنهاء";

        startBtn.classList.add("running");

        // منع تغيير الوقت أثناء التشغيل
        focusInput.disabled = true;
        breakInput.disabled = true;

        // بداية دورة جديدة
        isFocus = true;

        totalSeconds =
            parseInt(focusInput.value) * 60;

        remainingSeconds = totalSeconds;

        modeText.textContent = "تركيز";

        progressCircle.style.stroke = "white";

        updateTimeDisplay();
        updateCircle();

        timer = setInterval(() => {

            remainingSeconds--;

            updateTimeDisplay();
            updateCircle();

            // انتهت المرحلة
            if (remainingSeconds <= 0) {

                changeMode();

            }

        }, 1000);
    }


    // ==========================================
    // إنهاء الدورات
    // ==========================================

    function stopTimer() {

        clearInterval(timer);

        timer = null;

        isRunning = false;

        startBtn.textContent = "بدء";

        startBtn.classList.remove("running");

        focusInput.disabled = false;
        breakInput.disabled = false;

        // إعادة الحالة للتركيز
        isFocus = true;

        totalSeconds =
            parseInt(focusInput.value) * 60;

        remainingSeconds = totalSeconds;

        modeText.textContent = "تركيز";

        progressCircle.style.stroke = "white";

        updateTimeDisplay();
        updateCircle();
    }


    // ==========================================
    // زر البدء / الإنهاء
    // ==========================================

    startBtn.addEventListener("click", () => {

        if (!isRunning) {

            startTimer();

        } else {

            stopTimer();

        }

    });


    // ==========================================
    // تحديث المعاينة عند تغيير الوقت
    // ==========================================

    focusInput.addEventListener("input", () => {

        if (!isRunning && isFocus) {

            totalSeconds =
                parseInt(focusInput.value || 1) * 60;

            remainingSeconds = totalSeconds;

            updateTimeDisplay();
            updateCircle();
        }

    });


    breakInput.addEventListener("input", () => {

        if (!isRunning && !isFocus) {

            totalSeconds =
                parseInt(breakInput.value || 1) * 60;

            remainingSeconds = totalSeconds;

            updateTimeDisplay();
            updateCircle();
        }

    });


    // ==========================================
    // التشغيل الأولي
    // ==========================================

    totalSeconds =
        parseInt(focusInput.value) * 60;

    remainingSeconds = totalSeconds;

    progressCircle.style.strokeDasharray = circumference;

    progressCircle.style.strokeDashoffset = 0;

    updateTimeDisplay();
    updateCircle();

</script>

</body>
</html>
