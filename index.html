<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>همّة | مساعدك في الدراسة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro hold-brand">
  <div id="intro" class="intro-screen" aria-hidden="true"><div class="intro-bg"></div></div>
  <div class="bg"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

  <header class="top">
    <h1><span class="brand">همّة</span><span class="tag">، مساعدك في الدراسة</span></h1>
    <div class="tools">
    <button id="gearBtn" class="icon-btn gear" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button id="themeBtn" class="icon-btn" aria-label="تبديل الوضع">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
    </button>
    </div>
  </header>

  <main class="layout">
    <section class="card timer-card">
      <div class="modes">
        <span id="modeLabel" class="mode-pill">تركيز</span>
      </div>

      <div class="dial-wrap"><div class="dial">
        <svg viewBox="0 0 300 300">
          <defs>
            <linearGradient id="gFocus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
            <linearGradient id="gBreak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
          </defs>
          <circle class="track" cx="150" cy="150" r="130"/>
          <circle id="ring" class="ring" cx="150" cy="150" r="130" transform="rotate(-90 150 150)"/>
        </svg>
        <div class="dial-text">
          <div id="time" class="time">25:00</div>
        </div>
      </div></div>

      <p id="sub" class="sub">جاهز للبدء</p>

      <div class="controls">
        <button id="resetBtn" class="round-btn" aria-label="إعادة">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button id="startBtn" class="main-btn go">بدء</button>
      </div>

      <div class="settings">
        <label>وقت التركيز (د)
          <input id="focusMin" type="number" min="1" max="180" value="25">
        </label>
        <label>وقت الراحة (د)
          <input id="breakMin" type="number" min="1" max="60" value="5">
        </label>
        <label>راحة طويلة (د)
          <input id="longMin" type="number" min="1" max="120" value="15">
        </label>
        <label>راحة طويلة بعد (دورات)
          <input id="longEvery" type="number" min="2" max="12" value="4">
        </label>
      </div>
    </section>

    <aside class="side">
      <section class="card achieve">
        <div class="mini-dial">
          <svg viewBox="0 0 100 100">
            <circle class="track" cx="50" cy="50" r="42"/>
            <circle id="aRing" class="ring a" cx="50" cy="50" r="42" transform="rotate(-90 50 50)"/>
          </svg>
          <div id="aPct" class="pct">0%</div>
        </div>
        <div class="a-info">
          <h2>إنجازك لهذا اليوم</h2>
          <div id="aTime" class="a-time">00:00:00</div>
          <div class="a-row">
          <button id="goalAdd" class="goal-btn">+ إضافة هدف يومي محدد</button>
          <div id="goalBox" class="goal-box" hidden>
            <label class="goal">الهدف (ساعة)
              <input id="goalHr" type="number" min="0.5" max="16" step="0.5" value="2">
            </label>
            <button id="goalRemove" class="link-btn">إزالة الهدف</button>
          </div>
          <button id="aReset" class="link-btn">تصفير الإنجاز</button>
          </div>
        </div>
      </section>

      <div class="pair">
      <section class="card todo">
        <h2>المهام</h2>
        <div class="add">
          <input id="todoInput" type="text" placeholder="أضف مهمة جديدة…" maxlength="80">
          <button id="addBtn" class="add-btn" aria-label="إضافة">+</button>
        </div>
        <ul id="todoList"></ul>
        <p id="empty" class="empty">لا توجد مهام بعد. اكتب أول مهمة وابدأ.</p>
      </section>

      <section class="card notes">
        <h2>الملاحظات</h2>
        <textarea id="notes" placeholder="اكتب ملاحظاتك هنا…" spellcheck="false"></textarea>
      </section>
      </div>
    </aside>
  </main>

  <footer class="salawat">
    <span class="orn"></span>
    <br>
    <p>رب اشرحلي صدري ويسرلي امري واحلل عقدة من لساني يفقهوا قولي</p>
    <span class="orn"></span>
  </footer>

  <div id="overlay" class="overlay"></div>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="الإعدادات">
    <div class="drawer-head">
      <h2>الإعدادات</h2>
      <button id="closeSettings" class="del" aria-label="إغلاق">×</button>
    </div>
    <h3 class="group">التشغيل</h3>
    <label class="switch-row">
      <span><b>بدء التركيز تلقائيًا</b><small>يبدأ التركيز مباشرة بعد انتهاء الراحة</small></span>
      <span class="switch"><input id="autoFocus" type="checkbox" role="switch"><i></i></span>
    </label>
    <label class="switch-row">
      <span><b>بدء الراحة تلقائيًا</b><small>تبدأ الراحة مباشرة بعد انتهاء التركيز</small></span>
      <span class="switch"><input id="autoBreak" type="checkbox" role="switch"><i></i></span>
    </label>
    <h3 class="group">المظهر</h3>
    <label class="switch-row">
      <span><b>التأثيرات البصرية</b><small>الألوان المتدرجة والحركة وموجة تبديل الثيم</small></span>
      <span class="switch"><input id="fx" type="checkbox" role="switch" checked><i></i></span>
    </label>
  </aside>

  <script src="script.js"></script>
</body>
</html>
